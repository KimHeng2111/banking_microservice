spring:
  application:
    name: loan
  profiles:
    active: "${ACTIVE:default}"
  config:
    import: "${CONFIG_SERVER_URL:optional:configserver:http://localhost:8888}"
#  autoconfigure:
#    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
server:
  port: 8081
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER:localhost}:${EUREKA_PORT:9000}/eureka/
info:
  app:
    name: LoaN Microservice
    description: KimHengMicroServiceBank
    version: 1.0.1