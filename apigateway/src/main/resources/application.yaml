spring:
  application:
    name: apigatewaya
  profiles:
    active: ${ACTIVE:default}
#  config:
#    import: configserver:http://${configserver.host:localhost}:${configserver.port:8888}
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux: 
          discovery:
            locator:
              enabled: true		  
management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway" # បើកបង្ហាញ Endpoint ទាំងអស់រួមទាំង Gateway
  endpoint:
    gateway:
      enabled: true                  # បើកមុខងារគ្រប់គ្រង Route តាម Actuator
# ព័ត៌មាន App របស់អ្នករក្សាទុកដដែល
info:
  app:
    name: API GATEWAY Default Microservice
    description: KimHengMicroServiceBank
    version: 1.0.1
eureka:
  instance:
    preferIpAddress: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER:localhost}:${EUREKA_PORT:9000}/eureka/
server:
  port: 8080