services:
  config-server:
    build:
      context: ./../../config-server
      dockerfile: Dockerfile
    image: lengkimheng/configserver:latest
    mem_limit: 700m
    networks:
      - bank-network
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: KimHengBanking
      RABBITMQ_PASSWORD: KimHengBanking
  postgres:
    build:
      context: ./../../database/postgrest
      dockerfile: Dockerfile
    image: lengkimheng/postgres-db:latest
    mem_limit: 700m
    networks:
      - bank-network
    environment:
      POSTGRES_USER: loan_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: loan_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mongodb:
    build:
      context: ./../../database/mongodb
      dockerfile: Dockerfile
    image: lengkimheng/account-db:latest
    mem_limit: 700m
    networks:
      - bank-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: kimheng
      MONGO_INITDB_ROOT_PASSWORD: kimheng0308
    volumes:
      - mongo-data:/data/db
  loan:
    build:
      context: ./../../loan
      dockerfile: Dockerfile
    image: lengkimheng/loan:latest
    mem_limit: 700m
    networks:
      - bank-network
    depends_on:
      - config-server
      - postgres
      - eureka-server
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    environment:
      ACTIVE: prod
      CONFIGSERVER_HOST: config-server
      CONFIGSERVER_PORT: 8888
      EUREKA_SERVER: eureka-server
      EUREKA_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: KimHengBanking
      RABBITMQ_PASSWORD: KimHengBanking
  account:
    build:
      context: ./../../account
      dockerfile: Dockerfile
    image: lengkimheng/account:latest
    mem_limit: 700m
    networks:
      - bank-network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    depends_on:
      - config-server
      - eureka-server
      - mongodb
    environment:
      ACTIVE: prod
      CONFIGSERVER_HOST: config-server
      CONFIGSERVER_PORT: 8888
      EUREKA_SERVER: eureka-server
      EUREKA_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: KimHengBanking
      RABBITMQ_PASSWORD: KimHengBanking
  eureka-server:
    build:
      context: ./../../eureka-server
      dockerfile: Dockerfile
    image: lengkimheng/eurekaserver:latest
    mem_limit: 700m
    ports:
      - "9000:9000"
    networks:
      - bank-network
    depends_on:
      - config-server
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    environment:
      ACTIVE: prod
      CONFIGSERVER_HOST: config-server
      CONFIGSERVER_PORT: 8888
      EUREKA_SERVER: eureka-server
      EUREKA_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: KimHengBanking
      RABBITMQ_PASSWORD: KimHengBanking
  api-gateway:
    build:
      context: ./../../apigateway
      dockerfile: Dockerfile
    image: lengkimheng/apigateway:latest
    mem_limit: 700m
    networks:
      - bank-network
    depends_on:
      - config-server
      - eureka-server
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    environment:
      ACTIVE: prod
      CONFIGSERVER_HOST: config-server
      CONFIGSERVER_PORT: 8888
      EUREKA_SERVER: eureka-server
      EUREKA_PORT: 9000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: KimHengBanking
      RABBITMQ_PASSWORD: KimHengBanking
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=KimHengBanking
      - RABBITMQ_DEFAULT_PASS=KimHengBanking
    networks:
      - bank-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiMzFiY2Y5MTY5OWNmMzI4Y2I5NzE4MWE4MTNlNjBlNzkiLCJ0IjoiZmRkOTNmMWMtYTllMy00MzhjLWFiNjEtNDJiZmFmYzU4MzBjIiwicyI6Ik5tSm1NelpsWldZdE1XRTFOUzAwT1dVeExUZzVOVGd0Tm1RelpqUTJOREUyTW1JeCJ9
    networks:
      - bank-network
networks:
  bank-network:
    driver: bridge
volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
