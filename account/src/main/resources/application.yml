spring:
  application:
    name: account
  profiles:
    active: ${ACTIVE:default}
  config:
    import: configserver:http://${configserver.host:localhost}:${configserver.port:8888}
  banner:
    location: classpath:banner.txt
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
